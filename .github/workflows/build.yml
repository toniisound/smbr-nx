name: Build smbr.nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        run: dkp-pacman -S --noconfirm --needed switch-mesa switch-libdrm_nouveau switch-zlib

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload smbr.nro
        uses: actions/upload-artifact@v4
        with:
          name: smbr-nro
          path: smbr.nro
